/var/log/trailmark/*.log /var/log/nginx/trailmark.access.log {
    daily
    rotate 14
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
        systemctl kill -s HUP trailmark-api.service >/dev/null 2>&1 || true
    endscript
}
