upstream trailmark_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

log_format trailmark '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    listen 443 ssl;
    http2 on;
    server_name trailmark.example www.trailmark.example;

    ssl_certificate     /etc/letsencrypt/live/trailmark.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trailmark.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/trailmark.access.log trailmark;
    error_log  /var/log/nginx/trailmark.error.log warn;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location /static/ {
        alias /srv/trailmark/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://trailmark_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /srv/trailmark/public;
        try_files $uri /index.html;
    }
}
